# Instruction-tune Qwen2.5-1.5B-Instruct on a slice of Alpaca-cleaned.
# Sized for a 16 GB T4 (Colab free tier): 4-bit QLoRA, fp16, seq len 1024.
version: 1
name: qwen2.5-1.5b-alpaca
description: QLoRA instruction tuning, T4-safe defaults
model:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  quantization: 4bit
  dtype: auto            # float16 on T4, bfloat16 on Ampere+
  max_seq_length: 1024
dataset:
  source: hf
  path: yahma/alpaca-cleaned
  split: train
  format: alpaca
  max_samples: 5000
  eval_size: 200
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
training:
  epochs: 1
  learning_rate: 0.0002
  per_device_batch_size: 2
  gradient_accumulation_steps: 8
  logging_steps: 10
evaluation:
  metrics: [perplexity, rouge_l, token_f1]
  max_samples: 200
  max_new_tokens: 256
ship_rule:
  primary_metric: rouge_l
  min_improvement: 0.03
  guardrails:
    - metric: perplexity
      max_regression: 0.10
  min_eval_samples: 50
